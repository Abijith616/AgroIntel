name: elite_fitness_app
description: "Meridian — Your personal fitness command center."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_riverpod: ^3.3.2
  google_fonts: ^8.1.0
  hive_flutter: ^1.1.0
  share_plus: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/meridian_icon.png"
  adaptive_icon_background: "#090B0F"
  adaptive_icon_foreground: "assets/icon/meridian_icon.png"
